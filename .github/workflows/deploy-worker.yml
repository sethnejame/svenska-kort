name: Deploy worker
on:
  push:
    branches: [master]
    # The app and the API deploy independently. Touching `shared/` is the one
    # change that has to move both, because both compile it in.
    paths:
      - 'worker/**'
      - 'shared/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The same gate the app goes through: the Worker's typecheck, lint and
      # tests are all inside `npm run check`.
      - run: npm run check
      # Migrations run before the deploy, so a Worker is never live against a
      # database that lacks the tables its handlers expect.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply DB --remote --env staging

      # `d1 migrations apply` is known to exit 0 in Actions having applied
      # nothing, so its exit code is not the check. This asks the database what
      # it actually contains and fails the job naming anything missing.
      - name: Verify the schema really applied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Set explicitly rather than inferred: inference is the other half of
          # the bare-`exit 1`-with-no-log failure mode.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:verify:staging

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Staging on every push to master. Production is a tagged release,
          # which P15 wires up once there is a database worth protecting.
          command: deploy --env staging --var VERSION:${{ github.sha }}
