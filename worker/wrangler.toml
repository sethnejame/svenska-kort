name = "svenska-kort-api"
main = "src/index.ts"
compatibility_date = "2026-09-21"

[vars]
VERSION = "dev"

# The top-level binding is what `wrangler dev` and the tests use. Local D1 keeps
# its own SQLite file under `.wrangler/` and never contacts Cloudflare, so the
# id here is not resolved and is deliberately a placeholder.
[[d1_databases]]
binding = "DB"
database_name = "svenska-kort-staging"
database_id = "local"
migrations_dir = "migrations"

[env.staging]
name = "svenska-kort-api-staging"

[env.staging.vars]
VERSION = "dev"

# database_id comes from `wrangler d1 create svenska-kort-staging`. It is an
# account-scoped uuid, not a secret, and belongs in the repo so a deploy is
# reproducible.
#
# The binding stays `DB` in every environment even though `d1 create` suggests
# naming it after the database. Handlers then read `env.DB` and contain no
# knowledge of which environment they are running in.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "svenska-kort-staging"
database_id = "458b2b74-3445-430c-a5b6-a42f221fc12c"
migrations_dir = "migrations"

[env.production]
name = "svenska-kort-api"

[env.production.vars]
VERSION = "dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "svenska-kort-prod"
database_id = "6f994f9a-66b4-4b61-918f-ec3543bff00d"
migrations_dir = "migrations"
